<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gabarito: Conversor de Texto em Fala</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Sintetizador de Voz</h1>
      <p class="subtitle">Versão Completa com Controles Avançados</p>

      <div class="box" id="app-box">
        <!-- Campo de Texto -->
        <textarea id="text" placeholder="Digite seu texto aqui..."></textarea>

        <!-- Módulo 2: Seleção de Vozes -->
        <div class="control-group">
          <label for="select-voices">Escolha a Voz / Idioma:</label>
          <select id="select-voices">
            <option value="">Carregando vozes disponíveis...</option>
          </select>
        </div>

        <!-- Módulo 1: Controles de Áudio (Range) -->
        <div class="control-row">
          <div class="control-group">
            <label for="input-rate"
              >Velocidade: <span id="val-rate">1.0</span>x</label
            >
            <input
              type="range"
              id="input-rate"
              min="0.5"
              max="2"
              step="0.1"
              value="1.0"
            />
          </div>

          <div class="control-group">
            <label for="input-pitch"
              >Tom (Pitch): <span id="val-pitch">1.0</span></label
            >
            <input
              type="range"
              id="input-pitch"
              min="0"
              max="2"
              step="0.1"
              value="1.0"
            />
          </div>
        </div>

        <!-- Botão de Ação -->
        <button id="btn-speak">Ouvir Texto</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
